<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#111;
    color:#fff;
}

header{
    background:#000;
    color:#ff0000;
    padding:15px;
    font-size:28px;
    font-weight:bold;
    text-align:center;
}


.layout{

    display:flex;
    height:calc(100vh - 70px);
    overflow:hidden;

}


/* MENU */

.menuLateral{

    width:240px;
    background:#0d0d0d;
    padding:15px;
    overflow-y:auto;
    border-right:1px solid #222;

}


.menuItem{

    padding:14px;
    margin-bottom:8px;
    border-radius:8px;
    background:#1a1a1a;
    cursor:pointer;
    font-size:18px;
    transition:.2s;

}


.menuItem.active{

    background:#0078ff;
    font-weight:bold;

}


.menuItem.focus{

    outline:4px solid #00bfff;
    background:#006eff;
    transform:scale(1.05);

}


.menuItem:hover{

    background:#0060d0;

}


/* CONTEÚDO */

.conteudo{

    flex:1;
    display:flex;
    overflow:hidden;

}

/* COLUNA DE CANAIS */

.listaCanais{

    width:330px;
    background:#181818;
    border-right:1px solid #333;

    display:flex;
    flex-direction:column;

}

/* COLUNA DO PLAYER */

.playerArea{

    flex:1;

    display:flex;

    flex-direction:column;

    background:#000;

}


/* PLAYER */

.player{

    flex:1;

    padding:15px;

    background:#000;

}


.player video{

    width:100%;
    height:auto;
    background:#000;
    border-radius:10px;

}


.player iframe{

    width:100%;
    height:320px;
    display:none;
    border-radius:10px;

}

/* TÍTULOS DAS COLUNAS */

.tituloColuna{

    background:#000;

    padding:14px;

    font-size:22px;

    font-weight:bold;

    text-align:center;

    border-bottom:1px solid #333;

}

/* LISTA DOS CANAIS */

#listaCanais{

    flex:1;

    overflow-y:auto;

}

/* ITEM DO CANAL */

.canal{

    display:flex;

    align-items:center;

    gap:12px;

    padding:12px;

    cursor:pointer;

    border-bottom:1px solid #2b2b2b;

    transition:.2s;

}

.canal:hover{

    background:#006eff;

}

.canal.active{

    background:#0078ff;

}

.canal.focus{

    outline:4px solid #00bfff;

}

.canal img{

    width:60px;

    height:60px;

    object-fit:contain;

    background:#000;

    border-radius:8px;

}

.canal span{

    font-size:18px;

    color:#fff;

}

.favorito{

    background:none;

    border:none;

    color:gold;

    font-size:24px;

    cursor:pointer;

}

/* GRID */

.grid{

    flex:1;
    overflow-y:auto;

    display:grid;

    grid-template-columns:
    repeat(auto-fill,minmax(220px,1fr));

    gap:18px;

    padding:20px;

}


/* CARDS */

.card{

    background:#1b1b1b;

    border-radius:10px;

    overflow:hidden;

    cursor:pointer;

    transition:.2s;

    border:3px solid transparent;

}


.card:hover{

    transform:scale(1.04);
    border-color:#0078ff;

}


.card.focus{

    outline:5px solid #00bfff;
    transform:scale(1.08);
    z-index:5;

}


.card img{

    width:100%;
    height:300px;
    object-fit:cover !important;

}


.card h3{

    padding:12px;
    font-size:18px;
    text-align:center;

}


/* RESPONSIVO */

@media(max-width:1200px){

.grid{
    grid-template-columns:repeat(4,1fr);
}

}


@media(max-width:900px){

.grid{
    grid-template-columns:repeat(3,1fr);
}

}


@media(max-width:600px){

.grid{
    grid-template-columns:repeat(2,1fr);
}


.card img{

    height:220px;

}

}


/* BARRA ROLAGEM */

::-webkit-scrollbar{

    width:10px;

}


::-webkit-scrollbar-thumb{

    background:#444;
    border-radius:10px;

}


::-webkit-scrollbar-track{

    background:#111;

}

/* vídeo em tela cheia */
.plyr--fullscreen-active video,
.plyr--fullscreen-active .plyr__video-wrapper video {
    width:100%;
    height:100%;

/* container do player em fullscreen */
.plyr--fullscreen-active .plyr__video-wrapper {

}


/* remove bordas no fullscreen */
.plyr--fullscreen-active video {
    border-radius:0;

const enderecoSenha =

async function carregarSenha(){

        senhasValidas.indexOf(senhaSalva) !== -1

        .getElementById("telaLogin")

        .getElementById("mensagemLogin")
        .innerHTML =

let dadosEPG = [];



const videoPlayer = document.getElementById("videoPlayer");

const iframePlayer = document.getElementById("iframePlayer");



const player = new Plyr(videoPlayer,{

let hls = null;



// ===============================

function trocar(url){


    if(!url){
        return;
    }



    iframePlayer.style.display="none";

    iframePlayer.src="";



    videoPlayer.style.display="block";



    if(hls){

        hls.destroy();

        hls=null;

    }



    if(url.includes(".m3u8")){


        if(Hls.isSupported()){


            hls=new Hls({

                enableWorker:true,

                lowLatencyMode:true

            });



            hls.loadSource(url);

            hls.attachMedia(videoPlayer);



            hls.on(
                Hls.Events.MANIFEST_PARSED,
                ()=>{

                    videoPlayer.play();

                }
            );



        }


        else if(
            videoPlayer.canPlayType(
            "application/vnd.apple.mpegurl")
        ){


            videoPlayer.src=url;

            videoPlayer.play();


        }


        return;

    }



    videoPlayer.src=url;

    videoPlayer.load();

    videoPlayer.play();



}

function carregarFilmes(){

    var xhr = new XMLHttpRequest();

                var texto = xhr.responseText;

                }else if(texto.indexOf("#EXTM3U") >= 0){

            }

        }

    };

    xhr.open("GET", enderecoRAW + "?v=" + new Date().getTime(), true);

    xhr.send();

}

// ===============================
// CONVERSOR M3U
// ===============================



function converterM3U(m3u){



const linhas=m3u.split(/\r?\n/);



const lista=[];



let titulo="";

let imagem="";

let categoria="";
let tvgid="";



for(
let i=0;
i<linhas.length;
i++
){



let linha=linhas[i].trim();



if(
linha.startsWith("#EXTINF")
){



let nome=
linha.match(/,(.*)$/);



titulo=
nome ? nome[1] : "Sem título";



let logo=
linha.match(/tvg-logo="([^"]*)"/);



imagem=
logo ?
logo[1]
:
"https://via.placeholder.com/300x450?text=SEM+CAPA";



let grupo=
linha.match(/group-title="([^"]*)"/);
let idEPG =
linha.match(/tvg-id="([^"]*)"/);

tvgid =
idEPG ? idEPG[1].trim() : "";

categoria=
grupo ?
grupo[1]
.replace("C •","")
.trim()
.toLowerCase()
:
"canais";
let id =
linha.match(/tvg-id="([^"]*)"/);

tvgid =
id ? id[1] : "";



}



else if(
linha &&
linha.startsWith("http")
){



lista.push({

titulo,

imagem,

video:
linha.split("|")[0].trim(),

categoria,

tvgid

});



}



}



return lista;



}

function carregarEPG(){

fetch(enderecoEPG)

.then(xml => {

dadosEPG=[];

?
p.querySelector("title").textContent
:
"Sem informação"

});


});


console.log(
"EPG carregado:",
dadosEPG.length
);

console.log(dadosEPG.slice(0,10));

})

.catch(e=>{

console.log(
"Erro EPG",
e
);

});


}

<script>


// =================================
// MENU DE CATEGORIAS
// =================================


let categoriaAtual = "todos";


const menuItems =
document.querySelectorAll(".menuItem");



menuItems.forEach(item=>{


    item.onclick=function(){


        menuItems.forEach(m=>{

            m.classList.remove("active");

        });



        this.classList.add("active");



        categoriaAtual =
        this.dataset.cat;



        filtrarCategoria();

        atualizarListaCanais();



    };


});





function filtrarCategoria(){


focoLista=0;


atualizarFoco();



}





// =================================
// CONTROLE REMOTO
// =================================



let areaFoco="menu";


let focoMenu=0;


let focoLista=0;





function pegarMenu(){


return [
...document.querySelectorAll(".menuItem")
];


}




function pegarLista(){

    return [
        ...document.querySelectorAll(".canal")
    ];

}


function atualizarFoco(){



document
.querySelectorAll(".menuItem")
.forEach(item=>{


item.classList.remove("focus");


});




document
.querySelectorAll(".canal")
.forEach(canal=>{

canal.classList.remove("focus");

});


if(areaFoco==="menu"){



let menu=
pegarMenu();



if(menu[focoMenu]){


menu[focoMenu]
.classList.add("focus");



menu[focoMenu]
.scrollIntoView({

behavior:"smooth",

block:"center"

});



}



}



else if(areaFoco==="lista"){

let lista = pegarLista();

if(lista[focoLista]){

lista[focoLista].classList.add("focus");

lista[focoLista].scrollIntoView({

behavior:"smooth",

block:"nearest"

});

}

}

else if(areaFoco==="player"){

    videoPlayer.focus();

}

}





document.addEventListener(
"keydown",
function(e){



const tecla=e.key;



const menu=pegarMenu();


const lista=pegarLista();




switch(tecla){



case "ArrowDown":



if(areaFoco==="menu"){


focoMenu++;


if(
focoMenu>=menu.length
){

focoMenu=menu.length-1;

}


}

else{


focoLista++;


if(
focoLista>=lista.length
){

focoLista=lista.length-1;

}


}



atualizarFoco();

break;





case "ArrowUp":



if(areaFoco==="menu"){


focoMenu--;


if(focoMenu<0){

focoMenu=0;

}


}

else{


focoLista--;


if(focoLista<0){

focoLista=0;

}


}



atualizarFoco();

break;





case "ArrowRight":

if(areaFoco==="menu"){

    areaFoco="lista";

    focoLista=0;

}

else if(areaFoco==="lista"){

    areaFoco="player";

}

atualizarFoco();

break;





case "ArrowLeft":

if(areaFoco==="player"){

    areaFoco="lista";

}

else if(areaFoco==="lista"){

    areaFoco="menu";

}

atualizarFoco();

break;



if(areaFoco==="lista"){


areaFoco="menu";


}


atualizarFoco();


break;





case "Enter":

    if(areaFoco==="menu"){

        if(menu[focoMenu]){

            menu[focoMenu].click();

            areaFoco="lista";

            focoLista=0;

        }

    }

    else if(areaFoco==="lista"){

        if(lista[focoLista]){

            lista[focoLista].click();

            areaFoco="player";

        }

    }

    else if(areaFoco==="player"){

    player.toggleControls(true);

    player.fullscreen.toggle();

}

    atualizarFoco();

break;




case "Escape":

    if(player.fullscreen.active){

        player.fullscreen.exit();

        player.toggleControls(false);

        areaFoco="lista";

        atualizarFoco();

    }else{

        history.back();

    }

break;



}



});





// inicia foco no primeiro item


window.addEventListener(
"load",
()=>{


atualizarFoco();


}

);



</script>
